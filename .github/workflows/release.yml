name: Release

# Per the branch workflow in CLAUDE.md, the only thing that ever lands on
# master is the current version-integration branch being merged — so every
# push here is a real release candidate. semantic-release reads Conventional
# Commit messages since the last tag to decide whether (and how) to bump.
#
# Installer signing goes through SignPath (see CLAUDE.md §7). This workflow
# needs, in this repo's GitHub Settings → Secrets and variables → Actions:
#   Secrets:  SIGNPATH_API_TOKEN, SIGNPATH_ORGANIZATION_ID,
#             SIGNPATH_PROJECT_SLUG, SIGNPATH_SIGNING_POLICY_SLUG
#             (none of these are sensitive except the token, but keeping
#             them all as secrets avoids a second place to configure them —
#             see the "artifact-configuration-slug" line below for the one
#             value that's a plain variable, since it's optional)
#   Variable: SIGNPATH_ARTIFACT_CONFIGURATION_SLUG, only if it isn't named
#             "default" in the SignPath project
# all of which come from a SignPath organization/project set up for this
# repo — see https://signpath.io/solutions/open-source-community.
#
# The installer also bundles core.dll, built from the vendored PenguLoader
# submodule (native/vendor/pengu-loader — see THIRD_PARTY_NOTICES.md).
# "Build installer" below runs scripts/build-pengu-core.mjs automatically
# via npm's prebuild:win lifecycle hook — that's why checkout pulls
# submodules recursively (PenguLoader has its own nested cef-headers
# submodule) and both pnpm and MSBuild get set up first (core.vcxproj
# #includes a header generated by building PenguLoader's own `plugins`
# frontend via pnpm — see the comment in build-pengu-core.mjs for why).
# With CI=true (set by GitHub Actions automatically) that script fails the
# build if either step fails, rather than the silent local-dev fallback it
# uses otherwise.
on:
  push:
    branches: [master]

permissions:
  contents: write

# Never let two release runs race each other.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Electron's own binary download and electron-builder's NSIS/tooling
      # download are separate, large, version-pinned downloads that npm's
      # own cache (above) doesn't cover — see @electron/get's and
      # app-builder-lib's cache-path logic. Without this, both get
      # re-fetched from scratch on every single run.
      - name: Cache Electron/electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LOCALAPPDATA }}\electron\Cache
            ${{ env.LOCALAPPDATA }}\electron-builder\Cache
          key: ${{ runner.os }}-electron-cache-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # The pnpm store here backs build-pengu-core.mjs's install/build of
      # the vendored PenguLoader plugins subproject — resolved via `pnpm
      # store path` rather than hardcoded, since the exact location is
      # version/config-dependent.
      - name: Resolve pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('native/vendor/pengu-loader/plugins/pnpm-lock.yaml') }}

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # Creates the git tag and GitHub Release (with generated notes) if the
      # commits since the last release warrant one. package.json is never
      # touched or committed back to master — it stays "0.0.0-development"
      # in source control on purpose, so master never receives an automated
      # commit that would need a bypass on its branch protection.
      - name: Determine and publish release
        id: semrel
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # electron-builder reads the version to stamp into the installer and
      # latest.yml (which the in-app updater checks) from package.json, so
      # it's set here for the build only — never committed.
      - name: Set build version
        if: steps.semrel.outputs.new_release_published == 'true'
        shell: bash
        run: npm version ${{ steps.semrel.outputs.new_release_version }} --no-git-tag-version --allow-same-version

      # Unsigned on purpose — electron-builder computes latest.yml's sha512
      # from whatever's on disk when it runs, so if that ever runs against a
      # signed exe, the manifest would need regenerating too. Instead this
      # build stays unsigned, the exe gets signed by SignPath below, and only
      # then does fix-latest-yml.mjs (re)compute the manifest hash — against
      # the actual signed bytes that get published.
      - name: Build installer (unsigned)
        if: steps.semrel.outputs.new_release_published == 'true'
        run: npm run build:win

      # Calls SignPath's plain REST API directly (scripts/sign-with-signpath.ps1)
      # instead of the signpath/github-action-submit-signing-request
      # connector — that connector also requires a SignPath<->GitHub origin-
      # verification trust link beyond just a valid API token, which this
      # account's dashboard doesn't expose; see the script's header comment
      # and retry-signing.yml, where this was proven to work first. shell:
      # pwsh is required (not the default Windows PowerShell 5.1) for the
      # -Form parameter the script uses.
      - name: Sign installer via SignPath API
        if: steps.semrel.outputs.new_release_published == 'true'
        shell: pwsh
        run: |
          $unsigned = Get-ChildItem -Path release -Filter *-setup.exe | Select-Object -First 1
          ./scripts/sign-with-signpath.ps1 `
            -ApiToken '${{ secrets.SIGNPATH_API_TOKEN }}' `
            -OrganizationId '${{ secrets.SIGNPATH_ORGANIZATION_ID }}' `
            -ProjectSlug '${{ secrets.SIGNPATH_PROJECT_SLUG }}' `
            -SigningPolicySlug '${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}' `
            -ArtifactConfigurationSlug '${{ secrets.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG || 'default' }}' `
            -UnsignedFilePath $unsigned.FullName `
            -OutputFilePath $unsigned.FullName

      - name: Fix update manifest
        if: steps.semrel.outputs.new_release_published == 'true'
        shell: bash
        run: node scripts/fix-latest-yml.mjs

      - name: Publish release assets
        if: steps.semrel.outputs.new_release_published == 'true'
        shell: bash
        run: gh release upload "v${{ steps.semrel.outputs.new_release_version }}" release/*-setup.exe release/latest.yml --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
