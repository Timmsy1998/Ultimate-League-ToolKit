appId: com.ultk.app
productName: ULTK
# Explicit even though both already match electron-builder's defaults —
# asar: true is already the default; npmRebuild: false skips a native-
# dependency rebuild check that's pure overhead here since none of this
# project's runtime dependencies (checked: no bufferutil/utf-8-validate
# under ws, nothing else with a native addon) have anything to rebuild.
asar: true
npmRebuild: false
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
# core.dll (vendored from PenguLoader, see THIRD_PARTY_NOTICES.md) is built
# separately by CI (or locally via scripts/build-pengu-core.mjs) into
# resources/pengu-core/ before electron-builder runs — not committed to the
# repo, same as everything else electron-builder bundles from a build step.
extraResources:
  - from: resources/pengu-core
    to: pengu-core
  # Read at runtime for the system tray icon (see trayIconPath() in
  # src/main/index.ts) — build/ itself is only a build-time asset source
  # (buildResources above), not part of the app's own bundled files list,
  # so the one icon the running app needs from it has to be copied in
  # explicitly like this.
  - from: build/icon.ico
    to: icon.ico
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: ${productName}-${version}-setup.${ext}
publish:
  provider: github
  owner: Timmsy1998
  repo: Ultimate-League-ToolKit
